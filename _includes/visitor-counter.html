<!--
  Arcade-style visitor counter.
  Count comes from GoatCounter (account: omprabhu); the counting script itself is loaded
  on every page from _layouts/default.html. Styles: _sass/includes/_visitor_counter.scss.
-->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">

<div class="arcade-counter">
  <div class="arcade-counter__caption">PLAYERS JOINED</div>
  <div class="arcade-counter__score" id="arcade-counter-score" role="status">002,511</div>
  <div class="arcade-counter__blink" aria-hidden="true">&#9654; PRESS START</div>
</div>

<script>
(function () {
  // Visitors counted by the previous (Elfsight) counter, 9 Aug 2020 to 19 Nov 2026.
  // GoatCounter started from zero, so its total is added on top of this.
  var BASELINE = 2511;
  // Visitors to the home page ("/"), where this counter lives. The site-wide TOTAL endpoint
  // stayed at 0 while per-page counts updated, so it isn't used.
  var COUNTER_URL = 'https://omprabhu.goatcounter.com/counter//.json';
  var el = document.getElementById('arcade-counter-score');
  if (!el) return;

  // Zero-pad to at least 6 digits, then group with commas: 2511 -> "002,511".
  function format(n) {
    var s = String(Math.max(0, Math.round(n)));
    while (s.length < 6) s = '0' + s;
    return s.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  }

  function show(total) {
    el.setAttribute('aria-label', total.toLocaleString('en') + ' visitors');
    var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduceMotion || !window.requestAnimationFrame) { el.textContent = format(total); return; }

    // Tick the score up from zero, like an end-of-level tally.
    var duration = 1400, start = null;
    function step(t) {
      if (start === null) start = t;
      var p = Math.min((t - start) / duration, 1);
      var eased = 1 - Math.pow(1 - p, 3);
      el.textContent = format(total * eased);
      if (p < 1) window.requestAnimationFrame(step);
    }
    window.requestAnimationFrame(step);
  }

  // If GoatCounter can't be reached (e.g. blocked by an ad blocker), fall back to the baseline.
  fetch(COUNTER_URL)
    .then(function (r) { return r.ok ? r.json() : { count: '0' }; })
    .then(function (d) { return BASELINE + (parseInt(String(d.count).replace(/\D/g, ''), 10) || 0); })
    .catch(function () { return BASELINE; })
    .then(show);
})();
</script>
